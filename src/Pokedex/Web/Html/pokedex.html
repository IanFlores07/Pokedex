<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Nacional</title>
    <link rel="stylesheet" href="../Css/pokedex.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
<body>

    <div class="pokedex-frame">
        <div id="loading-overlay-pokedex" class="loading-overlay-pokedex">
            <div class="loading-energias-row">
                <span class="energia-circulo" style="--i:0; --c:#9aa4ab;" title="Acero"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" fill="#fff"/><circle cx="12" cy="12" r="3.6" fill="var(--c)"/></svg></span>
                <span class="energia-circulo" style="--i:1; --c:#3a9ad9;" title="Agua"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2C9 8 5 11 5 15a7 7 0 0 0 14 0c0-4-4-7-7-13z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:2; --c:#8cab20;" title="Bicho"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#fff"/><circle cx="12" cy="7" r="3" fill="#fff"/><path d="M10.5 5L8.5 2M13.5 5l2-3M7 12.5l-4-2M17 12.5l4-2M7 17.5l-4 2M17 17.5l4 2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12 10v10" stroke="var(--c)" stroke-width="1.4"/></svg></span>
                <span class="energia-circulo" style="--i:3; --c:#b8901f;" title="Dragón"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2c0 5-1.5 6-4 8 2 0 3-.5 4-1.5V15L8 21c4-1 6-4 6-8 0-3-1-6-2-11z" fill="#fff"/><path d="M12 3c2 3 5 5 5 9s-2 7-5 9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
                <span class="energia-circulo" style="--i:4; --c:#e6b800;" title="Eléctrico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M14 2L5 13.5h6L9.5 22 19 9.5h-6z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:5; --c:#6c4f94;" title="Fantasma"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v11l3.5-2.5L12 21l3.5-2.5L19 21V10a7 7 0 0 0-7-7z" fill="#fff"/><circle cx="9.5" cy="10.5" r="1.7" fill="var(--c)"/><circle cx="14.5" cy="10.5" r="1.7" fill="var(--c)"/></svg></span>
                <span class="energia-circulo" style="--i:6; --c:#e8501e;" title="Fuego"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 0 2 1 3 2 3-1-4-1-6 1-9z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:7; --c:#e87fb0;" title="Hada"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:8; --c:#5cc7d9;" title="Hielo"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
                <span class="energia-circulo" style="--i:9; --c:#b5651d;" title="Lucha"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="5" y="9" width="3.4" height="6" rx="1.7" fill="#fff"/><rect x="8.6" y="7" width="3.4" height="8" rx="1.7" fill="#fff"/><rect x="12.2" y="7" width="3.4" height="8" rx="1.7" fill="#fff"/><rect x="15.8" y="9" width="3.4" height="6" rx="1.7" fill="#fff"/><path d="M5.5 13h13v4a4 4 0 0 1-4 4h-5a4 4 0 0 1-4-4z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:10; --c:#a7a79a;" title="Normal"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.6 5.8 21.2l1.4-7L2 9.4l7-.9z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:11; --c:#4dad5b;" title="Planta"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 20C4 10 10 4 21 3c0 11-6 17-15 17z" fill="#fff"/><path d="M4 20L15 9" stroke="var(--c)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span>
                <span class="energia-circulo" style="--i:12; --c:#a24dc2;" title="Psíquico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M1.5 12C5 6 8.5 4.5 12 4.5S19 6 22.5 12C19 18 15.5 19.5 12 19.5S5 18 1.5 12z" fill="#fff"/><circle cx="12" cy="12" r="3.6" fill="var(--c)"/></svg></span>
                <span class="energia-circulo" style="--i:13; --c:#a5925a;" title="Roca"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 18l3-9 5-5 6 3 4 6-2 5z" fill="#fff"/><path d="M11 4l-1 7 7 1" stroke="var(--c)" stroke-width="1.2" fill="none"/></svg></span>
                <span class="energia-circulo" style="--i:14; --c:#3b3b4f;" title="Siniestro"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 3a9.5 9.5 0 1 0 6 15A8 8 0 0 1 15 3z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:15; --c:#c29a55;" title="Tierra"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 20l6-11 4 6 3-5 7 10z" fill="#fff"/></svg></span>
                <span class="energia-circulo" style="--i:16; --c:#9b4fb0;" title="Veneno"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 3h6v5l4 10a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l4-10z" fill="#fff"/><circle cx="10" cy="16" r="1.5" fill="var(--c)"/><circle cx="14" cy="14" r="1.1" fill="var(--c)"/></svg></span>
                <span class="energia-circulo" style="--i:17; --c:#7f95e0;" title="Volador"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 14c4-1 6-4 8-8 1 4 3 6 6 7 2 .4 4 0 6-1-1 4-5 8-10 8-4 0-8-2-10-6z" fill="#fff"/></svg></span>
            </div>
            <div class="loading-texto">CARGANDO...</div>
            <div class="loading-progreso" id="loading-progreso">0 / 1025</div>
        </div>
        <div class="pokedex-header">
            <div class="header-left-side">
                <div class="blue-sensor"></div>
                <h1 class="pokedex-title">POKÉDEX</h1>
            </div>
            <div class="header-right-controls">
                <div style="position: relative; display: inline-block;">
                    <button id="btn-toggle-tipos" class="btn-toggle-gens">[+] TIPOS</button>
                    <div id="tipos-box" class="gens-container-box collapsed"></div>
                </div>
                <button id="btn-ataques" class="btn-all" onclick="window.abrirModalAtaques()">⚔️ ATAQUES</button>
                <div style="position: relative; display: inline-block;">
                    <button id="btn-toggle-gens" class="btn-toggle-gens">[+] GENS</button>
                    <div id="gens-box" class="gens-container-box collapsed">
                        <button onclick="window.seleccionarGenFiltro(1)">GEN 1</button>
                        <button onclick="window.seleccionarGenFiltro(2)">GEN 2</button>
                        <button onclick="window.seleccionarGenFiltro(3)">GEN 3</button>
                        <button onclick="window.seleccionarGenFiltro(4)">GEN 4</button>
                        <button onclick="window.seleccionarGenFiltro(5)">GEN 5</button>
                        <button onclick="window.seleccionarGenFiltro(6)">GEN 6</button>
                        <button onclick="window.seleccionarGenFiltro(7)">GEN 7</button>
                        <button onclick="window.seleccionarGenFiltro(8)">GEN 8</button>
                        <button onclick="window.seleccionarGenFiltro(9)">GEN 9</button>
                        <button onclick="window.seleccionarGenFiltro(10)">GEN 10</button>
                    </div>
                </div>
                <button id="btn-all-pokes" class="btn-all" onclick="window.mostrarTodasLasGeneraciones()">TODAS</button>
                <input type="text" id="poke-search" placeholder="BUSCAR..." autocomplete="off">
            </div>
        </div>

        <div class="pokedex-screen">
            <div class="view-left" id="left-column" style="display: none;">
                <div class="img-box" id="caja-render-imagen">
                    <img id="sprite-poke-detail" src="" alt="Pokemon Art">
                </div>
                <div class="big-id" id="poke-id">#---</div>
                <div class="forms-grid">
                    <button class="btn-form-variant active" id="btn-var-reg" onclick="window.cambiarVarianteVisual('regular')">NORMAL</button>
                    <button class="btn-form-variant" id="btn-var-shiny" onclick="window.cambiarVarianteVisual('shiny')">SHINY</button>
                </div>
                <div class="forms-grid forms-grid-3">
                    <button class="btn-form-variant active" id="btn-img-poster" onclick="window.cambiarModoImagen('poster')">PÓSTER</button>
                    <button class="btn-form-variant" id="btn-img-sprite" onclick="window.cambiarModoImagen('sprite')">SPRITE</button>
                    <button class="btn-form-variant" id="btn-img-animado" onclick="window.cambiarModoImagen('animado')">ANIMADO</button>
                </div>
                <div class="media-toggle-buttons">
                    <button class="btn-3d" id="btn-toggle-3d" onclick="window.toggleModo3D()">VISTA 3D</button>
                </div>
                <div class="nav-controls">
                    <div class="nav-arrows">
                        <button onclick="window.cambiarPokemon(-1)">◄</button>
                        <button onclick="window.cambiarPokemon(1)">►</button>
                    </div>
                    <button class="btn-lista" onclick="window.toggleVistaLista()">VOLVER</button>
                </div>
            </div>

        <div class="dynamic-zone-wrapper full-screen-zone" id="dynamic-zone"></div>
        </div>

    <div class="pokedex-footer">
            <button class="btn-menu-back" onclick="location.href='index.html'">VOLVER AL MENÚ PRINCIPAL</button>
        </div>
    </div>

    <div class="pokedex-modal-overlay" id="modal-ataques" onclick="if(event.target===this) window.cerrarModalAtaques()">
        <div class="pokedex-modal-content ataques-modal-content">
            <button class="btn-close-modal" onclick="window.cerrarModalAtaques()">X</button>
            <h2 class="ataques-titulo">LISTA DE ATAQUES</h2>
            <div class="ataques-buscador-row">
                <input type="text" id="buscar-ataque" placeholder="BUSCAR ATAQUE..." autocomplete="off">
                <button type="button" class="btn-cerrar-ataques" onclick="window.cerrarModalAtaques()">✕ CERRAR</button>
            </div>
            <div id="lista-ataques" class="lista-ataques-grid"></div>
            <div id="detalle-ataque" class="detalle-ataque hidden"></div>
        </div>
    </div>

    <div class="pokedex-modal-overlay" id="modal-3d-fullscreen">
        <div class="pokedex-modal-content">
            <button class="btn-close-modal" id="btn-close-3d-modal">X</button>
            <div class="modal-3d-screen" id="modal-canvas-container">
                </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <script src="../Js/pokedex.js"></script>
</body>
</html>

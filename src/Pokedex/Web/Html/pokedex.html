<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Nacional</title>
    <link rel="stylesheet" href="../Css/pokedex.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>

    <div class="pokedex-frame">
        <div class="pokedex-header">
            <div class="header-left-side">
                <div class="blue-sensor"></div>
                <h1 class="pokedex-title">SISTEMA NACIONAL</h1>
            </div>
            <div class="header-right-controls">
                <button id="btn-toggle-gens" class="btn-toggle-gens">[+] GENS</button>
                <button id="btn-all-pokes" class="btn-all">TODAS</button>
                <input type="text" id="poke-search" placeholder="BUSCAR..." autocomplete="off">
            </div>
        </div>

        <div id="gens-box" class="gens-container-box collapsed">
            <div class="gen-row">
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(1)">GEN 1</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(2)">GEN 2</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(3)">GEN 3</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(4)">GEN 4</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(5)">GEN 5</button>
            </div>
            <div class="gen-row">
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(6)">GEN 6</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(7)">GEN 7</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(8)">GEN 8</button>
                <button class="gen-btn-retro" onclick="seleccionarGenFiltro(9)">GEN 9</button>
            </div>
        </div>

        <div id="pokedex-screen" class="pokedex-screen">
            
            <div id="left-column" class="view-left">
                <div class="img-box" id="media-display-box">
                    <img id="poke-img" src="" alt="Pokemon">
                    <button id="btn-fullscreen-3d" class="icon-fullscreen-inside hidden" onclick="abrirModalGigante3D()">⛶</button>
                </div>
                
                <div class="forms-grid">
                    <button id="btn-var-regular" class="btn-form-variant active" onclick="cambiarVariante('regular')">NORMAL</button>
                    <button id="btn-var-shiny" class="btn-form-variant" onclick="cambiarVariante('shiny')">SHINY</button>
                </div>

                <div class="big-id" id="poke-id">#001</div>
                
                <div class="media-toggle-buttons">
                    <button id="btn-toggle-3d" class="btn-3d" onclick="toggleModo3D()">VER 3D</button>
                </div>

                <div class="nav-controls">
                    <div class="nav-arrows">
                        <button onclick="cambiarPokemon(-1)">&lt;</button>
                        <button onclick="cambiarPokemon(1)">&gt;</button>
                    </div>
                    <button class="btn-lista" id="btn-toggle-lista-vista" onclick="toggleVistaLista()">LISTA</button>
                </div>
            </div>

            <div id="dynamic-zone" class="dynamic-zone-wrapper"></div>
        </div>

        <div class="pokedex-footer">
            <button id="btn-back-menu" class="btn-menu-back">VOLVER AL MENÚ</button>
        </div>
    </div>

    <div id="modal-3d-giant" class="modal-giant-dark" onclick="cerrarModalGigante3D()">
        <div class="contenido-modal-giant" onclick="event.stopPropagation()">
            <span class="cerrar-giant" onclick="cerrarModalGigante3D()">&times;</span>
            <div id="contenedor-render-giant" class="contenedor-render-giant"></div>
        </div>
    </div>

    <div id="modal-moves" class="modal-moves-retro">
        <div class="contenido-modal-moves">
            <span class="cerrar-moves" onclick="cerrarModalMoves()">&times;</span>
            <h3 class="moves-title-header">MOVES LIST</h3>
            <div class="table-wrapper-moves">
                <table class="moves-retro-table">
                    <thead>
                        <tr>
                            <th>MOVE</th>
                            <th>TYPE</th>
                            <th>CAT</th>
                            <th>POW</th>
                            <th>ACC</th>
                        </tr>
                    </thead>
                    <tbody id="moves-list-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Js/pokedex.js"></script>
</body>
</html>

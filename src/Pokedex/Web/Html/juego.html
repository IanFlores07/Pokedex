<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - Minijuego</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/juego.css">
</head>
<body>
    <div class="fondo-tema" aria-hidden="true"></div>
    <div class="burbujas" aria-hidden="true">
        <span style="--x:3%; --t:34px; --d:24s; --r:-20s"></span>
        <span style="--x:8%; --t:26px; --d:28s; --r:-3s"></span>
        <span style="--x:17%; --t:70px; --d:14s; --r:-16s"></span>
        <span style="--x:23%; --t:26px; --d:14s; --r:-13s"></span>
        <span style="--x:32%; --t:26px; --d:17s; --r:-2s"></span>
        <span style="--x:40%; --t:56px; --d:14s; --r:-18s"></span>
        <span style="--x:43%; --t:34px; --d:28s; --r:-1s"></span>
        <span style="--x:54%; --t:70px; --d:24s; --r:-1s"></span>
        <span style="--x:58%; --t:26px; --d:28s; --r:-4s"></span>
        <span style="--x:66%; --t:56px; --d:17s; --r:-17s"></span>
        <span style="--x:71%; --t:70px; --d:20s; --r:-17s"></span>
        <span style="--x:84%; --t:34px; --d:14s; --r:-18s"></span>
        <span style="--x:89%; --t:34px; --d:20s; --r:-3s"></span>
        <span style="--x:97%; --t:26px; --d:28s; --r:-1s"></span>
    </div>

    <div class="game-wrapper">
        <header>
            <h1 class="pixel-logo" id="titulo-juego">MINIJUEGO</h1>
            <div class="subtitulo-modo" id="subtitulo-modo"></div>
            <div class="score-box">
                <span>RACHA: <b id="racha">0</b></span>
                <span>MEJOR: <b id="mejor-racha">0</b></span>
            </div>
            <div class="difficulty-toggle">
                <button class="btn-dificultad" id="btn-facil" onclick="cambiarDificultad('facil')">FÁCIL</button>
                <button class="btn-dificultad" id="btn-dificil" onclick="cambiarDificultad('dificil')">DIFÍCIL</button>
            </div>
        </header>

        <main class="game-screen">
            <div id="zona-juego" class="zona-juego"></div>
            <div id="anterior" class="anterior"></div>

            <div id="intentos-info" class="intentos-info"></div>
            <div id="feedback" class="feedback"></div>

            <form id="guess-form" autocomplete="off">
                <input type="text" id="guess-input" placeholder="ESCRIBE UN NOMBRE..." autocomplete="off">
                <button type="submit">ADIVINAR</button>
            </form>

            <div id="sugerencias" class="sugerencias hidden"></div>

            <div id="pistas-box" class="hints-row hidden">
                <button type="button" class="btn-hint" id="hint-gen" onclick="mostrarPista('gen')">¿GENERACIÓN?</button>
                <button type="button" class="btn-hint" id="hint-tipo" onclick="mostrarPista('tipo')">¿TIPO?</button>
                <button type="button" class="btn-hint" id="hint-inicial" onclick="mostrarPista('inicial')">¿INICIAL?</button>
            </div>
            <div id="pistas-reveladas" class="pistas-reveladas"></div>

            <div class="action-buttons">
                <button id="btn-rendirse" type="button" onclick="rendirse()">👁️ REVELAR</button>
                <button id="btn-siguiente" type="button" class="hidden" onclick="siguiente()">SIGUIENTE ▶</button>
            </div>
        </main>

        <button class="btn-volver" onclick="location.href='menu.html'">◄ VOLVER A MINIJUEGOS</button>
    </div>

    <script src="../Js/datos.js"></script>
    <script src="../Js/juegos.js"></script>
</body>
</html>

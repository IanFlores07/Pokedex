<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - Selección de Juego</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/menu.css">
</head>
<body>

    <div class="menu-wrapper">
        <header class="main-header">
            <h1 class="pixel-logo">MODOS DE<span> JUEGO</span></h1>
            <p class="subtitle">ELIGE TU PRÓXIMO RETO</p>
        </header>

        <main class="games-grid">
            <button class="game-card" onclick="location.href='juego.html?modo=clasico'">
                <span class="game-title">Clásico</span><span class="game-icon">🔴</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=silueta'">
                <span class="game-title">Silueta</span><span class="game-icon">👤</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=descripcion'">
                <span class="game-title">Descripción</span><span class="game-icon">📖</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=zoom'">
                <span class="game-title">Zoom</span><span class="game-icon">🔍</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=card'">
                <span class="game-title">Card</span><span class="game-icon">🃏</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=random'">
                <span class="game-title">Random</span><span class="game-icon">🎲</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=anagrama'">
                <span class="game-title">Anagrama</span><span class="game-icon">🔠</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=tipo'">
                <span class="game-title">¿Cuál es su tipo?</span><span class="game-icon">🔥</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=peso'">
                <span class="game-title">El Peso Justo</span><span class="game-icon">⚖️</span>
            </button>
            <button class="game-card" onclick="location.href='juego.html?modo=stats'">
                <span class="game-title">Estadísticas</span><span class="game-icon">📊</span>
            </button>

            <button class="game-card full-width green" onclick="location.href='index.html'">
                <span class="game-title">VOLVER AL INICIO</span><span class="game-icon">🏠</span>
            </button>
        </main>

        <footer class="main-footer">
            <p>SELECCIÓN DE PROTOCOLO DE ENTRENAMIENTO</p>
        </footer>
    </div>

</body>
</html>

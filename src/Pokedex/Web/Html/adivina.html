<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quién es ese Pokémon?</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/adivina.css">
</head>
<body>

    <div class="game-wrapper">
        <header>
            <h1 class="pixel-logo">¿QUIÉN ES<span> ESE POKÉMON?</span></h1>
            <div class="score-box">
                <span>RACHA: <b id="racha">0</b></span>
                <span>MEJOR: <b id="mejor-racha">0</b></span>
            </div>
            <div class="difficulty-toggle">
                <button class="btn-dificultad" id="btn-facil" onclick="cambiarDificultad('facil')">FÁCIL</button>
                <button class="btn-dificultad active" id="btn-dificil" onclick="cambiarDificultad('dificil')">DIFÍCIL</button>
            </div>
        </header>

        <main class="game-screen">
            <div class="silhouette-box">
                <img id="poke-img" src="" alt="¿Quién es ese Pokémon?" class="silhouette">
            </div>

            <div id="feedback" class="feedback"></div>

            <form id="guess-form" autocomplete="off">
                <input type="text" id="guess-input" placeholder="ESCRIBE UN NOMBRE..." autocomplete="off">
                <button type="submit">ADIVINAR</button>
            </form>

            <div id="sugerencias" class="sugerencias hidden"></div>

            <div class="hints-row">
                <button type="button" class="btn-hint" id="hint-generacion" onclick="mostrarPistaTipo('generacion')">¿GENERACIÓN?</button>
                <button type="button" class="btn-hint" id="hint-tipo" onclick="mostrarPistaTipo('tipo')">¿TIPO?</button>
                <button type="button" class="btn-hint" id="hint-inicial" onclick="mostrarPistaTipo('inicial')">¿INICIAL?</button>
            </div>
            <div id="pistas-reveladas" class="pistas-reveladas"></div>

            <div class="action-buttons">
                <button id="btn-rendirse" type="button" onclick="rendirse()">👁️ REVELAR</button>
                <button id="btn-siguiente" type="button" class="hidden" onclick="nuevoPokemon()">SIGUIENTE ▶</button>
            </div>
        </main>

        <button class="btn-volver" onclick="location.href='menu.html'">◄ VOLVER A MINIJUEGOS</button>
    </div>

    <script src="../Js/datos.js"></script>
    <script src="../Js/adivina.js"></script>
</body>
</html>
